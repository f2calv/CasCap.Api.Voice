version: 2
updates:

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      time: "04:00"

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      time: "04:00"

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      time: "04:00"
    open-pull-requests-limit: 10
    ignore:
    #xunit.v3 majors are migrations that require test-platform validation.
    - dependency-name: xunit.*
      update-types: ["version-update:semver-major"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      time: "04:00"
