name: ci

on:
  workflow_dispatch:
    inputs:
      push-preview:
        type: boolean
        description: Push a pre-release NuGet package from a non-default branch?
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    uses: f2calv/gha-workflows/.github/workflows/lint.yml@v1

  versioning:
    permissions:
      contents: read
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    with:
      tag-prefix: ''
      tag-and-release: false

  build:
    runs-on: ubuntu-24.04
    needs: [versioning]
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: f2calv/gha-dotnet-nuget@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          nuget-user: ${{ github.repository_owner }}
          configuration: Release
          push-preview: ${{ inputs.push-preview }}
          version: ${{ needs.versioning.outputs.version }}
          solution-name: CasCap.Api.Voice.Release.slnx
          dotnet-restore-args: -p:Configuration=Release
          dotnet-test-args: --filter-not-trait Category=Integration

  release:
    needs: [lint, versioning, build]
    if: needs.versioning.outputs.release-exists == 'false'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    permissions:
      contents: write
    with:
      semVer: ${{ needs.versioning.outputs.version }}
      tag-prefix: ''
      move-major-tag: false
